<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="stylesheet" href="/kanban_todo/style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right"><button>Add New Task</button></div>
        </nav>
        <Section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">TODO</div>
                    <div class="right">count</div>
                </div> 
                <div draggable="true" class="task">
                    <h2>Task 1</h2>
                    <p>Description</p>
                    <button>Delete</button>
                </div>

            </div>

            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">count</div>
                </div>            
            </div>

            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">count</div>
                </div>    
            </div>

        </Section>
    </main>

    <script src="/kanban_todo/script.js"></script>
</body>
</html>
